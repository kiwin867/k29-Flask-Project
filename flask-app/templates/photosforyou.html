<!DOCTYPE html>
<html lang="en">
<head>
<!-- Doc title on browser's title bar -->
<title>Viewing photos for you </title>
</head>
<body>
<h4>Photos you may like</h4>
<!-- link to home of the web-app -->
<a href="/">Back to Home</a>
<div>
    <!-- start a loop for all users in users list -->
    {% for photo in photos %}
    <div>
        <!-- show the user's photo through the
        object's photo_src attr -->
<img src="{{ photo.photo_src }}" alt="Photo" style="height: 200px;">
<form method="POST" action="/likephotosforyou?photoid={{photo.photoid}}">
    <input type="hidden" name="photoid" value="{{ photo.photoid }}">
    <button type="submit" style="border:none;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;">
      <img src="{{ photo.heart_icon }}" alt="{% if photo.liked %}Unlike{% else %}Like{% endif %}" style="width:20px;height:20px;vertical-align:middle;">
      <span style="margin-left:6px;margin-right:6px;">{{ photo.phlikes }}</span>
      <h5>liked by:</h5>
      <div>
          {% for liker in photo.likers %}
              <span style="margin-left:6px;margin-right:6px;"> {{ liker.first_name }} {{ liker.last_name }}</span>
          {% endfor %}
      </div>
    </button>
</form>
<a href="/viewcomments?photoid={{ photo.photoid }}"> comments</a>
<h5>{{ photo.doc }} </h5>
<h15>{{ photo.name }} </h5>
<div> {% for tag in photo.tags%} 
<a href="{{ url_for('viewphotosbytag', tagname=tag, mode='all') }}">#{{ tag }}</a> 
{% endfor %}</div>
<br>
    · · ─ ·✶· ─ · ·
<br>
<!-- src attr is dynamically set to a user's photo URL -->
<!-- alt ayyt provides alternative text for image -->
<!-- style designated inline the height -->
</div>
{% endfor %}
<!-- end of the loop -->
</div>
</body>
</html>
