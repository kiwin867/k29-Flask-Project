<!DOCTYPE html>
<html lang="en">
<head>
<!-- Doc title on browser's title bar -->
<title>Viewing {{ alname }} </title>
</head>
<body>
<h4>{{ alname }}</h4>
<!-- link to home of the web-app -->
<a href="/">Back to Home</a>
<div>
    <!-- start a loop for all users in users list -->
    {% for photo in photos %}
    <div>
        <!-- show the user's photo through the
        object's photo_src attr -->
<img src="{{ photo.photo_src }}" alt="Photo" style="height: 200px;">
<form method="POST" action="/likephoto?photoid={{photo.photoid}}&albumid={{ albumid }}">
    <input type="hidden" name="photoid" value="{{ photo.photoid }}">
    <input type="hidden" name="albumid" value="{{ albumid }}">
    <button type="submit" style="border:none;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;">
      <img src="{{ photo.heart_icon }}" alt="{% if photo.liked %}Unlike{% else %}Like{% endif %}" style="width:20px;height:20px;vertical-align:middle;">
      <span style="margin-left:6px;margin-right:6px;">{{ photo.phlikes }}</span>
      <h5>liked by:</h5>
      <div>
          {% for liker in photo.likers %}
              <span style="margin-left:6px;margin-right:6px;"> {{ liker.first_name }} {{ liker.last_name }}</span>
          {% endfor %}
      </div>
    </button>
</form>
<a href="/viewcomments?photoid={{ photo.photoid }}&albumid={{ albumid }}"> comments</a>
<h5>{{ photo.doc }} </h5>
<h15>{{ photo.name }} </h5>
    {% if can_add %}
<form method="POST" action="/removephoto" onsubmit="return confirm('Are you sure you want to delete this photo?');">
    <input type="hidden" name="photoid" value="{{ photo.photoid }}">
    <input type="hidden" name="albumid" value="{{ albumid }}">
    <button type="submit" style="border:none;background:none;padding:0;cursor:pointer;color:red;">Delete Photo</button>
</form>
{% endif %}
<h5>{{ photo.name }} </h5>
<div> {% for tag in photo.tags%} 
<a href="{{ url_for('viewphotosbytag', tagname=tag, mode='all') }}">#{{ tag }}</a> 
{% endfor %}</div>
<!-- src attr is dynamically set to a user's photo URL -->
<!-- alt ayyt provides alternative text for image -->
<!-- style designated inline the height -->
</div>
{% endfor %}
<!-- end of the loop -->
</div>
{% if can_add %}
<a href="/addphoto?albumid={{ albumid }}" style="display: block; margin-top: 20px;">Add a new photo to this album</a>
<form method="POST" action="/deletealbum" onsubmit="return confirm('Are you sure you want to delete this album and all its photos?');" style="display: inline;">
    <input type="hidden" name="albumid" value="{{ albumid }}">
    <button type="submit" style="border:none;background:none;padding:0;cursor:pointer;color:red;margin-left: 20px;">Delete Album</button>
</form>
{% endif %}
</body>
</html>
