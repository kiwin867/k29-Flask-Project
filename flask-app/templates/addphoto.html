<!DOCTYPE html>
<html lang="en">
<head>
<title>Add Photo page</title>
<!-- title displayed on the browser's bar -->
</head>
<body>
<h4>Adding Photo to {{ alname }}</h4>
<!-- registration form -->
<!-- sets method POST for secure transmission -->
<!-- action attr states where form data are to be sent -->
<!-- enctype attr states how form-data should be encoded when submitted -->
<form method="POST" action="/addphoto" enctype="multipart/form-data">
<input type="hidden" name="albumid" value="{{ albumid }}">
<!-- input the first, last name, email etc. -->
<input type="file" name="photo" placeholder="Photo" required><br>
<input type="text" name="name" placeholder="Photo Name" required><br>
<!--input tag-->
<input type="text" name="tags" placeholder="Tags (example: animal cute funny)"><br>
<!-- submit button for the form -->
<button type="submit">Add</button>
</form>
</body>
</html>
